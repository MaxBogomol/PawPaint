plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.0'
}

version = "${app_version}"
group = 'dev.maxbogomol.paw_paint'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.java-gi:gtk:1.0.0-RC3'
}


tasks.named('run') {
    jvmArgs += "--enable-native-access=ALL-UNNAMED"
}

application {
    mainClass = "${group}.Main"
}

jar {
    manifest {
        attributes(
                'Main-Class': "${group}.Main"
        )
    }
}

shadowJar {
    archiveClassifier.set('')
}

tasks.register('createLinuxAppImage', Exec) {
    dependsOn "shadowJar"

    doFirst {
        delete "${buildDir}/build/linux-app-image"
    }

    executable = "${System.getProperty('java.home')}/bin/jpackage"
    args = [
            '--type', 'app-image',
            '--name', 'PawPaint',
            '--app-version', "${app_version}",
            '--input', "${buildDir}/libs",
            '--main-jar', "${shadowJar.archiveFileName.get()}",
            '--main-class', "dev.maxbogomol.paw_paint.Main",
            '--dest', "${buildDir}/build/linux-app-image",
            '--java-options', '--enable-native-access=ALL-UNNAMED'
    ]
}

tasks.register('buildLinuxAppImage', Exec) {
    dependsOn "createLinuxAppImage"

    doFirst {
        def appDir = "${buildDir}/build/linux-app-image/PawPaint"
        def configDir = "${projectDir}/config/appimage"

        project.copy {
            from configDir
            into appDir
            include "AppRun"
            include "dev.maxbogomol.paw_paint.desktop"
            include "dev.maxbogomol.paw_paint.png"
        }

        file("${appDir}/AppRun").setExecutable(true, false)
    }
}

tasks.register('buildLinuxAppImage-x86_64', Exec) {
    dependsOn "buildLinuxAppImage"

    executable = 'appimagetool'
    args = [
            "${buildDir}/build/linux-app-image/PawPaint",
            "${buildDir}/build/PawPaint-${app_version}-x86_64.AppImage"
    ]
}

tasks.register('buildLinuxAppImage-aarch64', Exec) {
    dependsOn "buildLinuxAppImage"

    executable = 'appimagetool'
    args = [
            "${buildDir}/build/linux-app-image/PawPaint",
            "${buildDir}/build/PawPaint-${app_version}-aarch64.AppImage"
    ]
}