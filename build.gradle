plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.0'
}

version = "${app_version}"
group = 'dev.maxbogomol.paw_paint'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.java-gi:gtk:1.0.0-RC3'
}


tasks.named('run') {
    jvmArgs += "--enable-native-access=ALL-UNNAMED"
}

application {
    mainClass = "${group}.Main"
}

jar {
    manifest {
        attributes(
                'Main-Class': "${group}.Main"
        )
    }
}

shadowJar {
    archiveClassifier.set('')
}

tasks.register('createLinuxAppImage', Exec) {
    dependsOn("shadowJar")

    doFirst {
        delete "${buildDir}/build/linux"
    }

    executable = "${System.getProperty('java.home')}/bin/jpackage"
    args = [
            '--type', 'app-image',
            '--name', 'PawPaint',
            '--app-version', "${app_version}",
            '--input', "${buildDir}/libs",
            '--main-jar', "${shadowJar.archiveFileName.get()}",
            '--main-class', "dev.maxbogomol.paw_paint.Main",
            '--dest', "${buildDir}/build/linux",
            '--java-options', '--enable-native-access=ALL-UNNAMED'
    ]
}

tasks.register('buildLinuxAppImage') {
    dependsOn("createLinuxAppImage")

    doLast {
        def appDir = "${buildDir}/build/linux/PawPaint"
        def configDir = "${projectDir}/config/appimage"

        project.copy {
            from configDir
            into appDir
            include "AppRun"
            include "dev.maxbogomol.paw_paint.desktop"
            include "dev.maxbogomol.paw_paint.png"
        }

        file("${appDir}/AppRun").setExecutable(true, false)
    }
}

tasks.register('buildLinuxAppImage-x86_64', Exec) {
    dependsOn("buildLinuxAppImage")

    environment('ARCH', 'x86_64')
    executable = 'appimagetool'
    args = [
            "${buildDir}/build/linux/PawPaint",
            "${buildDir}/build/PawPaint-${app_version}-linux-x86_64.AppImage"
    ]
}

tasks.register('buildLinuxAppImage-aarch64', Exec) {
    dependsOn("buildLinuxAppImage")

    environment('ARCH', 'aarch64')
    executable = 'appimagetool'
    args = [
            "${buildDir}/build/linux/PawPaint",
            "${buildDir}/build/PawPaint-${app_version}-linux-aarch64.AppImage"
    ]
}

tasks.register('createWindowsAppImage', Exec) {
    dependsOn("shadowJar")

    doFirst {
        delete "${buildDir}/build/windows"
    }

    executable = "${System.getProperty('java.home')}/bin/jpackage"
    args = [
            '--type', 'app-image',
            '--name', 'PawPaint',
            '--app-version', "${app_version}",
            '--input', "${buildDir}/libs",
            '--main-jar', "${shadowJar.archiveFileName.get()}",
            '--main-class', "dev.maxbogomol.paw_paint.Main",
            '--dest', "${buildDir}/build/windows",
            '--java-options', '--enable-native-access=ALL-UNNAMED'
    ]
}

tasks.register('buildWindowsStandalone-x86_64', Zip) {
    dependsOn("createWindowsAppImage")

    from "${buildDir}/build/windows/PawPaint"

    destinationDirectory = file("${buildDir}/build")
    archiveFileName = "PawPaint-${app_version}-windows-x86_64-standalone.zip"
}

tasks.register('createWindowsInstaller', Exec) {
    dependsOn("shadowJar")

    doFirst {
        delete "${buildDir}/build/windows-installer"
    }

    def winVersion = app_version.toString().count('.') == 1 ? "${app_version}.0" : "${app_version}"

    executable = "${System.getProperty('java.home')}/bin/jpackage"
    args = [
            '--type', 'exe',
            '--name', 'PawPaint',
            '--app-version', "${winVersion}",
            '--input', "${buildDir}/libs",
            '--main-jar', "${shadowJar.archiveFileName.get()}",
            '--main-class', "dev.maxbogomol.paw_paint.Main",
            '--dest', "${buildDir}/build/windows-installer",
            '--java-options', '--enable-native-access=ALL-UNNAMED',
            '--win-dir-chooser',
            '--win-menu',
            '--win-shortcut',
            '--win-shortcut-prompt',
            '--win-help-url', "${win_help_url}",
            '--win-update-url', "${win_update_url}",
            '--win-upgrade-uuid', "${win_upgrade_uuid}"
    ]
}

tasks.register('buildWindowsInstaller-x86_64', Zip) {
    dependsOn("createWindowsInstaller")

    from "${buildDir}/build/windows-installer"

    destinationDirectory = file("${buildDir}/build")
    archiveFileName = "PawPaint-${app_version}-windows-x86_64-installer.zip"
}